name: Deploy Snowflake Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_TO_DATAOPS_DEMO to authorize the migration run"
        required: true
        type: string

permissions:
  contents: read

# Prevent two migration runs from changing the same Snowflake environment at once.
concurrency:
  group: snowflake-dataops-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_TO_DATAOPS_DEMO' }}
    runs-on: ubuntu-latest
    environment: snowflake-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schemachange
        run: python -m pip install "schemachange==4.3.3"

      - name: Verify Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: DATAOPS_WH
          SNOWFLAKE_DATABASE: DATAOPS_DB
          SNOWFLAKE_SCHEMA: DATAOPS_DEMO
        run: schemachange verify --config-folder .

      - name: Deploy versioned migrations
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: DATAOPS_WH
          SNOWFLAKE_DATABASE: DATAOPS_DB
          SNOWFLAKE_SCHEMA: DATAOPS_DEMO
        run: schemachange deploy --config-folder .
