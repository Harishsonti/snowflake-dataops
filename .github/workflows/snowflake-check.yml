
name: Snowflake Migration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schemachange
        run: python -m pip install "schemachange>=4.1.0,<5.0.0"

      - name: Verify Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: DATAOPS_WH
          SNOWFLAKE_DATABASE: DATAOPS_DB
          SNOWFLAKE_SCHEMA: DATAOPS_DEMO
        run: schemachange verify --config-folder .

      - name: Preview migrations
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: DATAOPS_WH
          SNOWFLAKE_DATABASE: DATAOPS_DB
          SNOWFLAKE_SCHEMA: DATAOPS_DEMO
        run: schemachange deploy --config-folder . --dry-run
